version: "3.9"

services:
  api:
    build: .
    container_name: erickshaw_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: erickshaw_db
    environment:
      POSTGRES_USER: erickshaw
      POSTGRES_PASSWORD: erickshaw123
      POSTGRES_DB: erickshaw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
